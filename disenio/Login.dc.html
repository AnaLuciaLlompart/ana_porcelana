<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF7F7; font-family: 'Nunito Sans', sans-serif; color: #3D3238; }
  * { box-sizing: border-box; }
  a { color: #8C5A66; }
  a:hover { color: #B08791; }
  input, button { font-family: inherit; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAF7F7; padding: 40px 24px">
  <div style="width: 100%; max-width: 400px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 28px">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #F0E2E4; display: flex; align-items: center; justify-content: center">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#8C5A66" stroke-width="1.4">
          <circle cx="12" cy="7" r="3"></circle>
          <circle cx="7.2" cy="10.5" r="3"></circle>
          <circle cx="16.8" cy="10.5" r="3"></circle>
          <circle cx="9.2" cy="15.4" r="3"></circle>
          <circle cx="14.8" cy="15.4" r="3"></circle>
          <circle cx="12" cy="11.6" r="1.5" fill="#8C5A66" stroke="none"></circle>
        </svg>
      </div>
      <h1 style="margin: 0; text-align: center; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 28px; color: #8C5A66">Ana Porcelana</h1>
      <p style="margin: 0; text-align: center; font-size: 15px; color: #857078">Ingresá con tu usuario para administrar tu emprendimiento</p>
    </div>

    <div style="background: white; border: 1px solid #EBE0E2; border-radius: 10px; padding: 28px 26px; display: flex; flex-direction: column; gap: 18px">
      <div>
        <label style="display: block; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 14px; color: #857078; margin-bottom: 7px; letter-spacing: .03em">Usuario</label>
        <input value="{{ usuario }}" onChange="{{ onUsuario }}" placeholder="Tu usuario" style="width: 100%; padding: 11px 14px; border: 1px solid #EBE0E2; background: #FAF7F7; font-size: 15px; color: #3D3238; border-radius: 6px; outline: none" style-focus="border-color: #8C5A66">
      </div>

      <div>
        <label style="display: block; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 14px; color: #857078; margin-bottom: 7px; letter-spacing: .03em">Contraseña</label>
        <div style="position: relative">
          <input type="{{ tipoPass }}" value="{{ pass }}" onChange="{{ onPass }}" placeholder="Tu contraseña" style="width: 100%; padding: 11px 44px 11px 14px; border: 1px solid #EBE0E2; background: #FAF7F7; font-size: 15px; color: #3D3238; border-radius: 6px; outline: none" style-focus="border-color: #8C5A66">
          <button onClick="{{ toggleVer }}" title="{{ verTitulo }}" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 5px; cursor: pointer" style-hover="background: #F0E2E4">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857078" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="{{ iconoOjo }}"></path></svg>
          </button>
        </div>
      </div>

      <label style="display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 14px; color: #857078">
        <input type="checkbox" checked="{{ recordar }}" onChange="{{ onRecordar }}" style="accent-color: #8C5A66; width: 16px; height: 16px; cursor: pointer">
        Recordarme en esta computadora
      </label>

      <button style="width: 100%; padding: 12px; margin-top: 2px; border: 0; background: #8C5A66; color: white; border-radius: 6px; cursor: pointer; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 16px" style-hover="opacity: .9">Iniciar sesión</button>
    </div>

    <p style="margin: 20px 0 0; text-align: center; font-size: 13px; color: #B08791">⋆. 𐙚˚࿔ Accesorios hechos a mano con&nbsp;♥</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const OJO = "M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z";
const OJO_TACHADO = "M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21";

class Component extends DCLogic {
  state = { usuario: "", pass: "", ver: false, recordar: false };

  renderVals() {
    const s = this.state;
    return {
      usuario: s.usuario,
      onUsuario: e => this.setState({ usuario: e.target.value }),
      pass: s.pass,
      onPass: e => this.setState({ pass: e.target.value }),
      tipoPass: s.ver ? "text" : "password",
      iconoOjo: s.ver ? OJO_TACHADO : OJO,
      verTitulo: s.ver ? "Ocultar contraseña" : "Mostrar contraseña",
      toggleVer: () => this.setState(st => ({ ver: !st.ver })),
      recordar: s.recordar,
      onRecordar: () => this.setState(st => ({ recordar: !st.recordar }))
    };
  }
}
</script>
</body>
</html>
