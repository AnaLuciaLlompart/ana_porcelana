<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF7F7; font-family: 'Nunito Sans', sans-serif; color: #3D3238; }
  * { box-sizing: border-box; }
  a { color: #8C5A66; }
  a:hover { color: #B08791; }
  input, select, button, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #EBE0E2; border-radius: 3px; }
</style>
</helmet>
<div style="display: flex; height: 100vh; overflow: hidden; background: #FAF7F7">
  <aside style="display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; background: #8C5A66; transition: width .2s; width: {{ sidebarWidth }}">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 6px 0; flex: 1">
      <button onClick="{{ toggleSidebar }}" style="display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; justify-content: {{ contentJustify }}" style-hover="background: rgba(255,255,255,.1)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="flex-shrink: 0"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ false }}">
          <span style="font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; white-space: nowrap; color: white">Menú</span>
        </sc-if>
      </button>
      <div style="height: 1px; background: rgba(255,255,255,.15); margin: 6px 0"></div>
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="8">
        <button onClick="{{ item.onClick }}" title="{{ item.title }}" style="display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 10px; border-radius: 6px; border: 0; cursor: pointer; background: {{ item.bg }}; justify-content: {{ item.justify }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ item.stroke }}" stroke-width="1.8" style="flex-shrink: 0"><path stroke-linecap="round" stroke-linejoin="round" d="{{ item.icon }}"></path></svg>
          <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ false }}">
            <span style="font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; white-space: nowrap; color: {{ item.stroke }}">{{ item.label }}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
    <div style="padding: 0 6px 16px">
      <div style="height: 1px; background: rgba(255,255,255,.15); margin-bottom: 6px"></div>
      <button title="Mi cuenta" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 10px; border-radius: 6px; border: 0; background: rgba(255,255,255,.18); cursor: pointer; justify-content: {{ contentJustify }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" style="flex-shrink: 0"><path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13 13 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ false }}">
          <span style="font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; white-space: nowrap; color: white">Mi cuenta</span>
        </sc-if>
      </button>
      <button title="Cerrar sesión" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; justify-content: {{ contentJustify }}" style-hover="background: rgba(255,255,255,.1)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.8" style="flex-shrink: 0"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <sc-if value="{{ sidebarExpanded }}" hint-placeholder-val="{{ false }}">
          <span style="font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; white-space: nowrap; color: rgba(255,255,255,.8)">Cerrar sesión</span>
        </sc-if>
      </button>
    </div>
  </aside>

  <main style="flex: 1; overflow-y: auto; padding: 32px">
    <h1 style="margin: 0 0 24px; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 32px; color: #3D3238">Mi cuenta</h1>

    <div style="max-width: 640px; background: white; border: 1px solid #EBE0E2; border-radius: 8px; overflow: hidden">
      <div style="padding: 16px 20px; border-bottom: 1px solid #EBE0E2">
        <h2 style="margin: 0; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 14px; color: #8C5A66; letter-spacing: .06em">DATOS DE ACCESO</h2>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; padding: 18px 20px; border-bottom: 1px solid #EBE0E2">
        <div style="flex: 1; min-width: 0">
          <p style="margin: 0; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 13px; color: #857078; letter-spacing: .06em">USUARIO</p>
          <p style="margin: 5px 0 0; font-size: 16px; color: #3D3238">{{ usuario }}</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: flex-start; gap: 20px; padding: 18px 20px">
        <button onClick="{{ abrirModal }}" style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid #8C5A66; background: white; color: #8C5A66; border-radius: 6px; cursor: pointer; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px" style-hover="background: #F0E2E4">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          Cambiar contraseña
        </button>
      </div>
    </div>
  </main>
</div>

<sc-if value="{{ hayToast }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 9px; padding: 11px 20px; border-radius: 24px; background: #3D3238; box-shadow: 0 10px 30px rgba(61,50,56,.3)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8FD3AE" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
    <span style="font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px; color: white">{{ toast }}</span>
  </div>
</sc-if>

<sc-if value="{{ modalPass }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(61,50,56,.5); padding: 24px">
    <div style="width: 100%; max-width: 460px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(61,50,56,.25)">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #8C5A66">
        <h2 style="margin: 0; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 18px; color: white">Cambiar contraseña</h2>
        <button onClick="{{ cerrarModal }}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 6px; cursor: pointer" style-hover="background: rgba(255,255,255,.2)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div style="padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
        <sc-for list="{{ campos }}" as="c" hint-placeholder-count="3">
          <div>
            <sc-if value="{{ c.hayDivisor }}" hint-placeholder-val="{{ false }}">
              <div style="height: 1px; background: #EBE0E2; margin: 20px 0 30px"></div>
            </sc-if>
            <label style="display: block; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 13px; color: #857078; margin-bottom: 7px; letter-spacing: .06em">{{ c.label }}</label>
            <div style="position: relative">
              <input type="{{ c.tipo }}" value="{{ c.valor }}" onChange="{{ c.onChange }}" style="width: 100%; padding: 10px 44px 10px 13px; border: 1px solid {{ c.borde }}; font-size: 16px; color: #3D3238; background: white; border-radius: 5px; outline: none" style-focus="border-color: #8C5A66">
              <button onClick="{{ c.onVer }}" title="{{ c.verTitulo }}" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 5px; cursor: pointer" style-hover="background: #F0E2E4">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857078" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="{{ c.icono }}"></path></svg>
              </button>
            </div>
            <sc-if value="{{ c.hayAyuda }}" hint-placeholder-val="{{ false }}">
              <p style="margin: 6px 0 0; font-size: 13px; color: {{ c.ayudaColor }}">{{ c.ayuda }}</p>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid #EBE0E2">
        <button onClick="{{ cerrarModal }}" style="padding: 10px 18px; border: 1px solid #EBE0E2; background: white; color: #8C5A66; border-radius: 6px; cursor: pointer; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px" style-hover="background: #F0E2E4">Cancelar</button>
        <button onClick="{{ guardar }}" style="padding: 10px 18px; border: 0; background: #8C5A66; color: white; border-radius: 6px; cursor: pointer; font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 15px" style-hover="opacity: .9">Guardar</button>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;usuario&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ana&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = [
  { id: "inicio", label: "Inicio", icon: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" },
  { id: "materiales", label: "Materiales", icon: "M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" },
  { id: "categorias", label: "Categorías", icon: "M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z" },
  { id: "productos", label: "Productos", icon: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" },
  { id: "clientes", label: "Clientes", icon: "M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" },
  { id: "pedidos", label: "Pedidos", icon: "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" },
  { id: "gastos", label: "Gastos", icon: "M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" },
  { id: "informes", label: "Informes", icon: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" }
];
const OJO = "M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z";
const OJO_TACHADO = "M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.477 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21";
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const MINIMO = 8;

class Component extends DCLogic {
  state = {
    sidebarExpanded: false,
    ultimoCambio: "2026-06-14",
    modalPass: false, actual: "", nueva: "", repetir: "",
    verActual: false, verNueva: false, verRepetir: false, tocado: false,
    toast: ""
  };

  fmtFechaLarga(iso) { const p = iso.split("-"); return Number(p[2]) + " de " + MESES[Number(p[1]) - 1] + " de " + p[0]; }

  mostrarToast(t) { this.setState({ toast: t }); clearTimeout(this._toast); this._toast = setTimeout(() => this.setState({ toast: "" }), 2600); }

  renderVals() {
    const s = this.state;
    const exp = s.sidebarExpanded;
    const usuario = this.props.usuario ?? "Ana";

    const errActual = !s.actual.trim();
    const errNueva = s.nueva.length < MINIMO;
    const errRepetir = s.repetir !== s.nueva || !s.repetir;

    const campo = (id, label, valor, ver, err, ayuda, ayudaError, divisor) => ({
      label, valor, tipo: ver ? "text" : "password", hayDivisor: !!divisor,
      borde: s.tocado && err ? "#C0442F" : "#EBE0E2",
      icono: ver ? OJO_TACHADO : OJO, verTitulo: ver ? "Ocultar" : "Mostrar",
      hayAyuda: !!(s.tocado && err ? ayudaError : ayuda),
      ayuda: s.tocado && err ? ayudaError : ayuda,
      ayudaColor: s.tocado && err ? "#C0442F" : "#B08791",
      onChange: e => this.setState({ [id]: e.target.value }),
      onVer: () => this.setState(st => ({ ["ver" + id.charAt(0).toUpperCase() + id.slice(1)]: !st["ver" + id.charAt(0).toUpperCase() + id.slice(1)] }))
    });

    return {
      sidebarWidth: exp ? "200px" : "56px", sidebarExpanded: exp, contentJustify: exp ? "flex-start" : "center",
      toggleSidebar: () => this.setState({ sidebarExpanded: !exp }),
      navItems: NAV.map(n => ({ label: n.label, title: n.label, icon: n.icon, onClick: () => {}, justify: exp ? "flex-start" : "center",
        bg: "transparent", stroke: "rgba(255,255,255,.75)" })),
      usuario,
      cambioTexto: "Último cambio: " + this.fmtFechaLarga(s.ultimoCambio),
      hayToast: !!s.toast, toast: s.toast,
      modalPass: s.modalPass,
      abrirModal: () => this.setState({ modalPass: true, actual: "", nueva: "", repetir: "", verActual: false, verNueva: false, verRepetir: false, tocado: false }),
      cerrarModal: () => this.setState({ modalPass: false }),
      campos: [
        campo("actual", "CONTRASEÑA ACTUAL", s.actual, s.verActual, errActual, "", "Ingresá tu contraseña actual."),
        campo("nueva", "CONTRASEÑA NUEVA", s.nueva, s.verNueva, errNueva, "Mínimo " + MINIMO + " caracteres", "La contraseña nueva necesita al menos " + MINIMO + " caracteres.", true),
        campo("repetir", "REPETIR CONTRASEÑA NUEVA", s.repetir, s.verRepetir, errRepetir, "", "Las dos contraseñas no coinciden.")
      ],
      guardar: () => {
        if (errActual || errNueva || errRepetir) { this.setState({ tocado: true }); return; }
        this.setState({ modalPass: false, ultimoCambio: "2026-09-07" });
        this.mostrarToast("Contraseña actualizada");
      }
    };
  }
}
</script>
</body>
</html>
