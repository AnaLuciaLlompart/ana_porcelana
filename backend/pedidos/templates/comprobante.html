{% extends 'correo_base.html' %}
{% block titulo %}Comprobante de pago{% endblock %}
{% block contenido %}
        <tr>
          <td style="padding:10px 28px 22px;font-family:Arial,sans-serif;font-size:16px;line-height:24px;color:#3D3238;">
            {# linebreaksbr escapa el texto de la usuaria y pasa sus saltos de línea a <br>. #}
            <p style="margin:0;">{{ mensaje|linebreaksbr }}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px;"><div style="height:1px;background:#EBE0E2;"></div></td>
        </tr>
        <tr>
          <td style="padding:18px 28px 26px;font-family:Arial,sans-serif;font-size:14px;line-height:22px;color:#857078;">
            El comprobante de pago va adjunto en PDF: {{ archivo }}
          </td>
        </tr>
{% endblock %}
