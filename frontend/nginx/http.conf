# nginx sin certificado: la variante de la PC, y la del servidor hasta
# que certbot emite el certificado (elegir-config.sh la activa cuando no
# lo encuentra). Atiende cualquier nombre en el puerto 80.
server {
    listen 80;
    server_name _;

    # El desafío de Let's Encrypt. certbot, instalado en el servidor fuera
    # de Docker, escribe un archivo en /var/www/certbot, carpeta que el
    # contenedor tiene montada de solo lectura; Let's Encrypt lo pide por
    # http y acá se sirve. En la PC la carpeta no existe y esta ruta da
    # 404, sin consecuencias.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/sitio.conf;
}
