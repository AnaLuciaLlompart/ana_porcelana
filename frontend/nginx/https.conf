# nginx con certificado: la variante del servidor una vez que certbot
# emitió el certificado (elegir-config.sh la activa cuando lo encuentra).
# El dominio está escrito acá y en elegir-config.sh; para Django, en
# .env.produccion.

# Puerto 80: solo el desafío de Let's Encrypt (para las renovaciones) y
# redirigir todo lo demás a https. Django también redirige
# (SECURE_SSL_REDIRECT), pero con esto ningún pedido por http llega a él.
server {
    listen 80;
    server_name anaporcelana.com.ar www.anaporcelana.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Puerto 443: el sitio. Los certificados son los que certbot guarda en
# /etc/letsencrypt del servidor, montado de solo lectura en el contenedor
# (docker-compose.servidor.yml). "live" apunta siempre al más nuevo, así
# que una renovación no cambia estas rutas: alcanza con recargar nginx,
# que es lo que hace el deploy-hook de certbot.
#
# La cabecera HSTS no se agrega acá: la manda Django en cada respuesta de
# /api/ (SECURE_HSTS_SECONDS) y el navegador la aplica a todo el dominio.
server {
    listen 443 ssl;
    http2 on;
    server_name anaporcelana.com.ar www.anaporcelana.com.ar;

    ssl_certificate     /etc/letsencrypt/live/anaporcelana.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anaporcelana.com.ar/privkey.pem;

    include /etc/nginx/sitio.conf;
}
