# Las cabeceras de seguridad, en todas las respuestas de nginx. Se incluye
# en sitio.conf a nivel server y otra vez dentro de cada location que
# define su propio add_header (Cache-Control): en nginx, una location con
# add_header propio no hereda los del server, así que sin ese include
# saldría sin estas cuatro.
#
# always: también en los errores (el 404 de una foto que no está, el 502
# si el backend no responde). Sin él solo van en 200, 3xx y poco más.

# HSTS: un año solo por https. La decide cada servidor con la variable
# $hsts: https.conf la escribe y http.conf la deja vacía, y nginx no
# manda una cabecera cuyo valor es vacío. El navegador la ignora si le
# llega por http, así que mandarla ahí no tendría sentido.
add_header Strict-Transport-Security $hsts always;

# El sitio no se puede mostrar dentro de un iframe de otro sitio
# (clickjacking).
add_header X-Frame-Options "DENY" always;

# El navegador trata cada archivo como el tipo que dice ser, nunca como
# script por adivinar el contenido.
add_header X-Content-Type-Options "nosniff" always;

# Al seguir un enlace a otro sitio no se le cuenta desde qué página se
# salió; dentro del sitio sí.
add_header Referrer-Policy "same-origin" always;
