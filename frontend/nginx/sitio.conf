# Lo que comparten las dos variantes del servidor (http.conf y
# https.conf): se incluye dentro de su bloque server. Es el equivalente
# para producción del proxy de Vite (vite.config.js): el navegador ve un
# solo origen, y nginx decide qué sirve él y qué reenvía a Django.

# El React compilado (COPY del Dockerfile).
root /usr/share/nginx/html;
index index.html;

# Las imágenes se validan en Django hasta 15 MB (config/validadores.py).
# 16 deja pasar esas más el sobre del multipart, así la que se pasa de 15
# la rechaza Django con su mensaje; nginx solo frena lo absurdo, con 413.
client_max_body_size 16m;

# Comprimir lo que es texto. El HTML se comprime siempre con gzip on; las
# imágenes ya vienen comprimidas y no se tocan.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# La API: todo lo que empieza con /api/ va a Django por la red interna de
# Docker, donde "backend" es el nombre del servicio en docker-compose.yml.
location /api/ {
    # nginx resuelve los nombres una sola vez, al arrancar. Si el backend
    # se recrea con otra IP, seguiría apuntando a la vieja y daría 502.
    # Con el DNS interno de Docker como resolver y el destino en una
    # variable, vuelve a preguntar cuando hace falta.
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8000;
    proxy_pass $backend;

    # Lo que Django necesita saber del pedido original:
    # - Host: el dominio que escribió el visitante, para ALLOWED_HOSTS.
    # - X-Forwarded-Proto: si llegó por https, para SECURE_PROXY_SSL_HEADER.
    # - X-Forwarded-For: la IP del visitante, para los throttles y axes.
    #   Se escribe la IP que nginx ve ($remote_addr) y NO
    #   $proxy_add_x_forwarded_for, que le sumaría lo que el cliente haya
    #   mandado con ese nombre: así la cabecera trae un solo valor, el de
    #   verdad, y no se puede falsificar.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Las fotos, directo desde el volumen que comparte con el backend, sin
# pasar por Django. alias: /media/productos/x.jpg es
# /var/www/media/productos/x.jpg. 30 días de caché y no un año: el
# storage reutiliza un nombre solo después de borrar el archivo, así que
# una foto resubida con el mismo nombre podría verse vieja ese tiempo.
# nosniff: el navegador la trata como lo que dice ser, nunca como script.
# autoindex queda apagado (es el default): la carpeta no se puede recorrer.
location /media/ {
    alias /var/www/media/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
}

# Los archivos que genera Vite llevan un hash del contenido en el nombre
# (index-B3kQ9.js): si cambia el contenido cambia el nombre, así que se
# pueden guardar un año sin riesgo de ver uno viejo.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# Todo lo demás es la aplicación de React. Si la ruta es un archivo que
# existe (el favicon), se sirve; si no (/gestion/pedidos, /productos/14),
# se devuelve index.html y React Router decide qué mostrar. Sin esto,
# recargar la página en esas direcciones daría 404.
# no-cache: el navegador vuelve a preguntar por index.html en cada carga,
# así ve el despliegue nuevo apenas se sube (el index nuevo apunta a los
# assets nuevos).
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}
