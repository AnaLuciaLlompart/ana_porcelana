# Lo que comparten las dos variantes del servidor (http.conf y
# https.conf): se incluye dentro de su bloque server. Es el equivalente
# para producción del proxy de Vite (vite.config.js): el navegador ve un
# solo origen, y nginx decide qué sirve él y qué reenvía a Django.

# El React compilado (COPY del Dockerfile).
root /usr/share/nginx/html;
index index.html;

# No publicar la versión de nginx: la cabecera Server queda "nginx" a
# secas, y las páginas de error de nginx tampoco la muestran.
server_tokens off;

# Las cabeceras de seguridad (cabeceras.conf). Acá valen para las
# locations sin add_header propio (/api/); las que lo tienen (/media/,
# /assets/, /) vuelven a incluir el archivo adentro, y /api/productos/
# también, aunque no lo necesite (ver ahí).
include /etc/nginx/cabeceras.conf;

# Las imágenes se validan en Django hasta 15 MB (config/validadores.py).
# 16 deja pasar una de esas más el sobre del multipart, así la que se pasa
# de 15 la rechaza Django con su mensaje; nginx solo frena lo absurdo, con
# 413. Vale para todo el sitio salvo /api/productos/, que recibe varias
# fotos en un pedido y tiene su propio tope más abajo.
client_max_body_size 16m;

# Comprimir lo que es texto. El HTML se comprime siempre con gzip on; las
# imágenes ya vienen comprimidas y no se tocan.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Las fotos de producto. El alta y el guardado de la ficha traen todas las
# fotos en un solo pedido (corrección del tutor: una transacción), así que
# acá el cuerpo puede
# llegar a diez fotos de 15 MB más el sobre del multipart: 160 MB. Es la
# única ruta con ese tope; el resto del sitio sigue en los 16m de arriba,
# así un pedido grande sin sesión no puede ocupar disco en cualquier
# dirección. ^~ es un prefijo que le gana a /api/ por ser más largo y que
# además frena las locations con expresión regular de más abajo. Cubre
# también los GET de /api/productos/, donde el tope no cambia nada.
location ^~ /api/productos/ {
    client_max_body_size 160m;

    # Cómo se reenvía a Django: lo mismo que /api/ (ver proxy-api.conf).
    include /etc/nginx/proxy-api.conf;

    # Sin add_header propio heredaría las cabeceras del server igual; se
    # incluyen para que la ruta que recibe archivos las tenga escritas a
    # la vista, por seguridad.
    include /etc/nginx/cabeceras.conf;
}

# La API: todo lo que empieza con /api/ va a Django por la red interna de
# Docker, donde "backend" es el nombre del servicio en docker-compose.yml.
# Cómo se reenvía está en proxy-api.conf, que comparte con /api/productos/.
location /api/ {
    include /etc/nginx/proxy-api.conf;
}

# Las fotos, directo desde el volumen que comparte con el backend, sin
# pasar por Django. alias: /media/productos/x.jpg es
# /var/www/media/productos/x.jpg. 30 días de caché y no un año: el
# storage reutiliza un nombre solo después de borrar el archivo, así que
# una foto resubida con el mismo nombre podría verse vieja ese tiempo.
# nosniff: el navegador la trata como lo que dice ser, nunca como script.
# autoindex queda apagado (es el default): la carpeta no se puede recorrer.
location /media/ {
    alias /var/www/media/;
    expires 30d;
    add_header Cache-Control "public";
    # Cache-Control es un add_header propio: las de seguridad se incluyen
    # de nuevo acá (ver cabeceras.conf).
    include /etc/nginx/cabeceras.conf;
}

# Los archivos que genera Vite llevan un hash del contenido en el nombre
# (index-B3kQ9.js): si cambia el contenido cambia el nombre, así que se
# pueden guardar un año sin riesgo de ver uno viejo.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Ver cabeceras.conf: Cache-Control es add_header propio.
    include /etc/nginx/cabeceras.conf;
}

# Los escáneres automáticos piden /.env, /.git/config, /wp-admin/x.php,
# /adminer.php… buscando otros sistemas. Acá no hay nada de eso, pero el
# catch-all de abajo les respondía 200 con index.html; mejor un 404. Son
# locations con expresión regular, que en nginx le ganan a las de prefijo:
# por eso la primera exceptúa /.well-known/, donde el server del puerto 80
# sirve el desafío de certbot con una location de prefijo que, si no,
# quedaría tapada. (?!…) es "no seguido de".
location ~ /\.(?!well-known/) {
    return 404;
}

# Scripts de servidor que este sitio no tiene (PHP, ASP, JSP, CGI). ~* es
# sin distinguir mayúsculas, porque /x.PHP es el mismo escáner; $ es el
# final de la ruta (la query string no cuenta).
location ~* \.(php|php3|asp|aspx|jsp|cgi)$ {
    return 404;
}

# Todo lo demás es la aplicación de React. Si la ruta es un archivo que
# existe (el favicon), se sirve; si no (/gestion/pedidos, /productos/14),
# se devuelve index.html y React Router decide qué mostrar. Sin esto,
# recargar la página en esas direcciones daría 404.
# no-cache: el navegador vuelve a preguntar por index.html en cada carga,
# así ve el despliegue nuevo apenas se sube (el index nuevo apunta a los
# assets nuevos).
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    # Ver cabeceras.conf: Cache-Control es add_header propio.
    include /etc/nginx/cabeceras.conf;
}
