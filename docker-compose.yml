# Los tres contenedores del sistema y cómo se conectan. Se levanta con
# `docker compose up -d --build` desde esta carpeta, en la PC y en el
# servidor por igual; lo que el servidor tiene de más (los certificados)
# está en docker-compose.servidor.yml.
#
# No hay contraseñas ni dominios acá: todo lo que cambia entre máquinas
# está en .env (ver .env.dist), que Compose les pasa a los contenedores
# con env_file.

services:

  # PostgreSQL 17, la misma versión que en desarrollo. La imagen oficial
  # crea la base y la usuaria la primera vez, con las variables POSTGRES_*
  # de .env. Los datos viven en el volumen "base": el
  # contenedor se puede borrar y recrear sin perderlos.
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - base:/var/lib/postgresql/data
    networks:
      - interna
    # pg_isready responde cuando la base acepta conexiones. El backend
    # espera a esto (service_healthy) antes de arrancar: si no, migrate
    # correría contra una base que todavía está iniciando y fallaría.
    # -h localhost pregunta por TCP, que es como se conecta el backend; la
    # primera vez la imagen levanta un servidor provisorio sin TCP para
    # crear la base, y sin -h ese provisorio ya contestaría que sí.
    # $$ es un $ literal para Compose: las variables las lee el
    # contenedor, no Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Django con gunicorn (backend/Dockerfile). No publica ningún puerto:
  # solo nginx le habla, por la red interna de Docker, con el nombre
  # "backend". Las fotos van al volumen "media", que comparte con nginx.
  backend:
    build: ./backend
    env_file: .env
    # La usuaria y la contraseña con las que Django se conecta a la base
    # salen de las POSTGRES_* del .env, así la contraseña se escribe una
    # sola vez. ${...} lo completa Compose al leer este archivo, con el
    # .env de esta carpeta, y environment le gana a env_file. DB_NAME no
    # está acá: sigue en el .env, para poder apuntar el backend a otra
    # base del mismo contenedor cambiando una línea (DESPLIEGUE.md).
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - media:/app/media
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # nginx con el React compilado (frontend/Dockerfile). Es el único que
  # se ve desde afuera: los puertos 80 y 443 de la máquina son los suyos.
  # El 443 recién atiende cuando hay certificado (elegir-config.sh). Lee
  # las fotos del mismo volumen que escribe el backend, de solo lectura.
  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media:/var/www/media:ro
    networks:
      - interna
    depends_on:
      - backend
    restart: unless-stopped

# Los volúmenes: lo que sobrevive a borrar y recrear los contenedores.
# Docker los guarda fuera de ellos, con el nombre de la carpeta como
# prefijo (ana_porcelana_base, ana_porcelana_media). Lo que hay que
# respaldar es esto: la base y las fotos.
volumes:
  base:
  media:

# La red por la que se hablan los tres contenedores (corrección F16).
# Compose ya armaba una por su cuenta (ana_porcelana_default); declarada
# acá se ve en el archivo y tiene nombre. Docker le pone adelante el de la
# carpeta: ana_porcelana_interna. Adentro cada uno encuentra a los otros
# por el nombre del servicio (db en DB_HOST, backend en nginx).
networks:
  interna:
